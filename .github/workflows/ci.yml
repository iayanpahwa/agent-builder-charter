name: ci

# Formatting, linting, and the test suite. The suite is deliberately offline: no charter is
# executed, no model is called, no `claude` CLI is needed. Every wall this repo claims is tested
# as a pure function (see tests/), so CI can prove the enforcement story without spending tokens.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Split from the test job on purpose. black and ruff are standalone tools: the interpreter they
  # RUN on has nothing to do with the version this code TARGETS, which pyproject.toml pins for
  # both (`target-version = py39`), so their output here is identical to a 3.9 run. Installing
  # them under 3.9 instead capped them at whatever the last 3.9-compatible release was — black
  # dropped 3.9 at 25.12.0, so the pinned 26.5.1 simply could not be installed and CI failed at
  # the install step before running anything.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # Pinned so a tool release cannot turn a green branch red on its own. Bump deliberately.
      - name: Install tools
        run: pip install --disable-pip-version-check "black==26.5.1" "ruff==0.16.0"

      # black formats, ruff lints — see the note in pyproject.toml on why not both formatters.
      - name: Format check
        run: black --check --diff .

      - name: Lint
        run: ruff check --output-format github .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # 3.9 is the floor the tooling targets (see pyproject.toml target-version). Running the
          # suite on it catches syntax a newer local interpreter would happily accept — this job
          # is what actually holds that floor.
          python-version: "3.9"

      # requirements.txt is the runtime dependency (PyYAML + jsonschema, what core/loader.py and
      # the headless runner import); requirements-dev.txt adds pytest. Both are needed, and
      # omitting the latter meant `python -m pytest` had no pytest to run.
      - name: Install test dependencies
        run: pip install --disable-pip-version-check -r requirements.txt -r requirements-dev.txt

      - name: Tests
        run: python -m pytest -q

      # The charters shipped in the repo are also covered by tests/test_schema_validation.py;
      # running the validator directly proves the documented one-liner still works as advertised.
      - name: Validate shipped charters
        run: |
          for charter in $(git ls-files '*.charter.yaml'); do
            python core/validate.py "$charter"
          done
