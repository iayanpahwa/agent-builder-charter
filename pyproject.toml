# Tooling config only — this repo is not a distributable package (agents are self-contained
# scripts, and core/ is imported by path, not installed). There is deliberately no
# [project] table: adding one would imply `pip install`-ability that isn't the point here.
#
# line-length is 100, not black's default 88, because that is the width this codebase was
# already written to. black discovers this file automatically, so an editor hook or a bare
# `black .` now agrees with the repo instead of imposing 88 and reflowing hundreds of lines
# on every touch.
#
# Division of labour: black formats, ruff lints. Do NOT run `ruff format` — ruff's formatter
# is black-compatible but not identical, and the two disagree on ~5 files here over whether
# to split a line whose overflow comes from a trailing `# noqa` comment. Running both just
# trades one diff for the other forever. (Switching wholesale to `ruff format` is a fine
# future call; it means reformatting once and pointing editor hooks at ruff.)

[tool.black]
line-length = 100
target-version = ["py39"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
# The selected sets are the ones this codebase already writes against — the inline
# `# noqa: BLE001 / E402 / E731 / S310` comments predate this config and stay meaningful
# only while BLE, E, and S are selected. RUF100 then flags any noqa that stops applying.
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort — import ordering
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "BLE",  # flake8-blind-except (BLE001, used deliberately with noqa in the runners)
    "S",    # flake8-bandit (S310 on urllib, gated by the egress guard)
    "RUF",  # ruff-specific, incl. RUF100 unused-noqa
]

# E501 is off because black owns line width. Left on, it fires only where the formatter
# cannot help — inside a long string, a URL, or a trailing comment — so it becomes a rule
# you satisfy by mangling prose. ruff's own docs advise against pairing it with a formatter.
ignore = ["E501"]

# Everything else is suppressed at the line that needs it, with a reason, rather than by
# file: `# noqa: S110` on a deliberate swallow documents intent AND leaves the rule live to
# catch the next silent one. Only genuinely file-wide properties belong below.
[tool.ruff.lint.per-file-ignores]
# Tests assert (S101), their fixtures carry obviously-fake credentials to prove the real ones
# get dropped (S105), and they shell out to python3 and the runners to exercise the real
# entrypoints rather than a mock (S603, S607). All four are what a test here looks like.
"tests/*" = ["S101", "S105", "S603", "S607"]
